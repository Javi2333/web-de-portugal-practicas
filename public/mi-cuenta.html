<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta | ledparatodos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-light">

  <script src="header.js"></script>

  <main id="main" tabindex="-1">

    <section class="ct-hero">
      <div class="sh-wrap ac-hero">
        <div>
          <nav aria-label="Ruta de navegación"><ol class="ct-crumbs"><li><a href="index.html">Inicio</a></li><li aria-current="page">Mi cuenta</li></ol></nav>
          <h1 class="ct-title" id="acHello">Mi cuenta</h1>
          <p class="ct-intro" id="acEmail"></p>
          <p class="ac-tariff" id="acTariff" hidden></p>
        </div>
        <button type="button" class="ac-logout" id="acLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Cerrar sesión
        </button>
      </div>
    </section>

    <section class="co-body" id="accountPage">
      <div class="sh-wrap">
        <div class="co-alert" id="acFlash" role="status" hidden></div>

        <div class="ac-layout">
          <!-- Pedidos -->
          <section class="ac-orders" aria-labelledby="acOrdersTitle">
            <h2 class="ac-h2" id="acOrdersTitle">Mis pedidos <span id="acOrdersCount"></span></h2>
            <div id="acOrders" aria-live="polite">
              <div class="ac-skeleton"></div><div class="ac-skeleton"></div>
            </div>
            <p class="ac-note">Los pedidos hechos sin iniciar sesión no aparecen aquí: tienes su resumen en el email de confirmación.</p>
          </section>

          <div class="ac-aside">
            <!-- Datos personales -->
            <section class="ac-box" aria-labelledby="acDataTitle">
              <div class="ac-box-head">
                <h2 class="ac-h3" id="acDataTitle">Mis datos</h2>
              </div>
              <div id="acProfileView">
                <dl class="ac-data">
                  <div><dt>Nombre</dt><dd id="acViewName">—</dd></div>
                  <div><dt>Email</dt><dd id="acViewEmail">—</dd></div>
                  <div><dt>Teléfono</dt><dd id="acViewPhone">—</dd></div>
                </dl>
                <button type="button" class="co-link" id="acEditBtn">Editar datos</button>
              </div>
              <form class="ac-form" id="acProfileForm" novalidate hidden>
                <div class="co-field">
                  <label for="acName">Nombre y apellidos</label>
                  <input id="acName" name="name" type="text" autocomplete="name" maxlength="120" />
                </div>
                <div class="co-field">
                  <label for="acPhone">Teléfono</label>
                  <input id="acPhone" name="phone" type="tel" autocomplete="tel" maxlength="30" pattern="[\d\s\+\-\.\(\)]{9,30}" />
                  <p class="co-error" id="acPhone-err"></p>
                </div>
                <p class="co-hint">Para cambiar el email de la cuenta, <a href="contacto.html">escríbenos</a>.</p>
                <div class="ac-actions">
                  <button type="submit" class="hm-btn hm-btn--primary">Guardar</button>
                  <button type="button" class="co-link" id="acEditCancel">Cancelar</button>
                </div>
              </form>
              <div class="co-alert" id="acProfileAlert" role="status" hidden></div>
            </section>

            <!-- Contraseña -->
            <section class="ac-box" aria-labelledby="acPassTitle">
              <h2 class="ac-h3" id="acPassTitle">Cambiar contraseña</h2>
              <form class="ac-form" id="acPassForm" novalidate>
                <div class="co-field">
                  <label for="acPass">Nueva contraseña</label>
                  <div class="ac-pass">
                    <input id="acPass" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="acPass-hint" />
                    <button type="button" class="ac-pass-toggle" data-toggle-pass="acPass" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
                  </div>
                  <p class="co-hint" id="acPass-hint">Mínimo 8 caracteres.</p>
                  <p class="co-error" id="acPass-err"></p>
                </div>
                <div class="co-field">
                  <label for="acPass2">Repite la contraseña</label>
                  <input id="acPass2" name="password2" type="password" autocomplete="new-password" />
                  <p class="co-error" id="acPass2-err"></p>
                </div>
                <button type="submit" class="hm-btn hm-btn--dark">Cambiar contraseña</button>
              </form>
              <div class="co-alert" id="acPassAlert" role="status" hidden></div>
            </section>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="footer.js"></script>

  <script src="config.js"></script>
  <script src="main.js"></script>
  <script src="account.js"></script>
</body>
</html>
